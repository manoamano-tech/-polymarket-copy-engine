<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сделка — CopyEdge</title><style>:root{color-scheme:dark;--bg:#070a0f;--p:#111923;--line:#223043;--t:#eef4fa;--m:#8998ab;--b:#77a7ff;--g:#42d986;--r:#ff6e78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,sans-serif}.w{width:min(760px,calc(100% - 22px));margin:auto;padding:20px 0 60px}a{color:var(--b);text-decoration:none}.box{margin-top:18px;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:20px}h1{font-size:28px;margin:8px 0}.m{color:var(--m)}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#18283d;color:var(--b);font-weight:800}.v{font-size:19px;font-weight:750;margin-top:3px}.good{color:var(--g)}.bad{color:var(--r)}</style></head><body><main class="w"><a href="/app/">← Назад в панель</a><div class="box" id="content"><div class="m">Загрузка сделки…</div></div></main><script>const m=x=>'$'+Number(x||0).toFixed(2),id=new URLSearchParams(location.search).get('id');fetch('/api/dashboard',{cache:'no-store'}).then(x=>x.json()).then(d=>{let x=d.equity.find(z=>String(z.trade_id)===String(id));if(!x){document.getElementById('content').innerHTML='<h1>Сделка не найдена</h1>';return}document.getElementById('content').innerHTML=`<div class="m">Виртуальная сделка #${x.trade_id}</div><h1>${x.event}</h1><div class="m">${x.outcome} · ${x.leader}</div><div class="step"><div class="n">1</div><div><div class="m">Трейдер</div><div class="v">${x.leader} создал подходящую позицию</div></div></div><div class="step"><div class="n">2</div><div><div class="m">CopyEdge</div><div class="v">Правило выполнено → виртуально копируем на ${m(x.stake_usd)}</div></div></div><div class="step"><div class="n">3</div><div><div class="m">Цена входа</div><div class="v">${x.entry_price}</div></div></div><div class="step"><div class="n">4</div><div><div class="m">Рынок закрыт · ${x.settled} UTC</div><div class="v ${x.trade_pnl>=0?'good':'bad'}">Результат сделки ${m(x.trade_pnl)}</div></div></div>`})</script></body></html>
