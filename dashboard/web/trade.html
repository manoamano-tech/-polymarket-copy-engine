<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сделка — CopyEdge</title><style>:root{color-scheme:dark;--bg:#070a0f;--p:#111923;--line:#223043;--t:#eef4fa;--m:#8998ab;--b:#77a7ff;--g:#42d986;--r:#ff6e78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,sans-serif}.w{width:min(760px,calc(100% - 22px));margin:auto;padding:20px 0 60px}a{color:var(--b);text-decoration:none}.box{margin-top:18px;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:20px}h1{font-size:28px;margin:8px 0}.m{color:var(--m)}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#18283d;color:var(--b);font-weight:800}.v{font-size:19px;font-weight:750;margin-top:3px}.good{color:var(--g)}.bad{color:var(--r)}</style></head><body><main class="w"><a href="/app/">← Назад в панель</a><div class="box" id="content"><div class="m">Загрузка сделки…</div></div></main><script>const m=x=>'$'+Number(x||0).toFixed(2),id=new URLSearchParams(location.search).get('id');fetch('/api/dashboard',{cache:'no-store'}).then(x=>x.json()).then(d=>{let x=d.trade_details.find(z=>String(z.id)===String(id));if(!x){document.getElementById('content').innerHTML='<h1>Сделка не найдена</h1>';return}let slip=x.slippage_pct==null?'—':x.slippage_pct+'%',price=x.leader_price==null?'—':x.leader_price+' → '+x.our_price;document.getElementById('content').innerHTML=`<div class="m">Виртуальная сделка #${x.id}</div><h1>${x.event}</h1><div class="m">${x.outcome} · ${x.leader}</div><div class="step"><div class="n">1</div><div><div class="m">Что сделал трейдер</div><div class="v">${x.leader} набрал позицию ${m(x.build_usd)} за ${x.fill_count} покупок</div><div class="m">Средняя цена ${x.leader_price} · набор занял ${x.build_seconds??'—'} сек.</div></div></div><div class="step"><div class="n">2</div><div><div class="m">Что увидел CopyEdge</div><div class="v">Цена лидера → наша: ${price}</div><div class="m">Изменение цены: ${slip} · средняя задержка наблюдения ${x.latency_seconds??'—'} сек.</div></div></div><div class="step"><div class="n">3</div><div><div class="m">Решение правила</div><div class="v good">Условия выполнены → виртуально копируем ${m(x.stake_usd)}</div><div class="m">От $500 · цена хуже не более 1% · 2–9 покупок</div></div></div><div class="step"><div class="n">4</div><div><div class="m">Текущий статус</div><div class="v ${x.pnl==null?'':x.pnl>=0?'good':'bad'}">${x.status==='OPEN'?'Рынок ещё не закрыт':'Результат '+m(x.pnl)}</div><div class="m">${x.settled?'Закрыто '+x.settled+' UTC':'Открыто '+x.opened+' UTC'}</div></div></div>`})</script></body></html>
