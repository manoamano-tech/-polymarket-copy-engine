<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сделки — CopyEdge</title><style>:root{color-scheme:dark;--bg:#070a0f;--p:#101823;--line:#223043;--t:#eef4fa;--m:#8998ab;--b:#77a7ff;--g:#42d986;--r:#ff6e78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.w{width:min(1100px,calc(100% - 22px));margin:auto;padding:20px 0 60px}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between}h1{font-size:34px;margin:34px 0 6px}.m{color:var(--m)}.filters{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}select{background:#0d151f;color:var(--t);border:1px solid var(--line);padding:10px;border-radius:10px}.list{display:grid;gap:9px}.trade{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr auto;gap:12px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:15px}.event{font-weight:750;overflow:hidden;text-overflow:ellipsis}.good{color:var(--g)}.bad{color:var(--r)}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#182432}@media(max-width:650px){.trade{grid-template-columns:1fr 1fr}.event{grid-column:1/-1}.trade .go{grid-column:1/-1;color:var(--b)}h1{font-size:30px}}</style></head><body><main class="w"><div class="top"><a style="color:var(--b)" href="/app/">← Панель</a><b>Copy<span style="color:var(--b)">Edge</span></b></div><h1>Сделки</h1><div class="m">Текущее правило или вся уникальная история без дублей стратегий</div><div class="filters"><select id="mode"><option value="rule">Текущее правило</option><option value="history">Вся история</option></select><select id="leader"><option value="all">Все трейдеры</option></select><select id="status"><option value="all">Все статусы</option><option value="OPEN">Открытые</option><option value="SETTLED">Закрытые</option></select></div><div class="list" id="list"></div></main><script>let D,H=[];const $=x=>document.getElementById(x),m=x=>'$'+Number(x||0).toFixed(2);async function render(){let hist=$('mode').value==='history',l=$('leader').value,s=$('status').value;if(hist)H=await fetch('/api/history?leader='+encodeURIComponent(l),{cache:'no-store'}).then(r=>r.json());let a=(hist?H:D.trade_details).filter(x=>(l==='all'||x.leader===l)&&(s==='all'||x.status===s));$('list').innerHTML=a.map(x=>`<div class="trade"><div class="event">${x.event||'—'}<div class="m">${x.leader} · ${x.outcome}</div></div><div><div class="m">Позиция лидера</div>${m(x.build_usd)}</div><div><div class="m">Цена входа</div>${x.our_price||x.entry_price||'—'}</div><div><div class="m">Результат при $50</div><b class="${x.pnl==null?'':x.pnl>=0?'good':'bad'}">${x.pnl==null?'—':m(x.pnl)}</b></div><div class="go"><span class="pill">${x.status==='OPEN'?'ОТКРЫТА':'ЗАКРЫТА'}</span></div></div>`).join('')}fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;$('leader').innerHTML+=[...new Set(d.trader_cards.map(x=>x.leader))].map(x=>`<option>${x}</option>`).join('');render()});['mode','leader','status'].forEach(x=>$(x).addEventListener('change',render))</script></body></html>
