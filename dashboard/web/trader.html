<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трейдер — CopyEdge</title><style>:root{color-scheme:dark;--bg:#070a0f;--p:#101823;--line:#223043;--t:#eef4fa;--m:#8998ab;--b:#77a7ff;--g:#42d986}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.w{width:min(1000px,calc(100% - 22px));margin:auto;padding:20px 0 60px}a{color:var(--b);text-decoration:none}h1{font-size:40px;margin:35px 0 4px}.m{color:var(--m)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.card,.panel{background:linear-gradient(180deg,#121b27,#0e151e);border:1px solid var(--line);border-radius:15px;padding:17px}.v{font-size:23px;font-weight:800;margin-top:5px}.good{color:var(--g)}.panel{margin-top:12px}.chart{height:220px}svg{width:100%;height:100%}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}h1{font-size:34px}.chart{height:180px}}</style></head><body><main class="w"><a href="/app/traders.html">← Все трейдеры</a><h1 id="name">…</h1><div class="m" id="last"></div><section class="cards"><div class="card"><div class="m">Сигналов</div><div class="v" id="fills">—</div></div><div class="card"><div class="m">Собранных позиций</div><div class="v" id="builds">—</div></div><div class="card"><div class="m">Средняя позиция</div><div class="v" id="avg">—</div></div><div class="card"><div class="m">Сделок по новому правилу</div><div class="v" id="trades">—</div></div><div class="card"><div class="m">Закрыто</div><div class="v" id="settled">—</div></div><div class="card"><div class="m">Прибыль</div><div class="v good" id="pnl">—</div></div><div class="card"><div class="m">Доходность</div><div class="v good" id="roi">—</div></div></section><section class="panel"><b>Результат нового правила во времени</b><div class="chart"><svg id="chart" viewBox="0 0 1000 220" preserveAspectRatio="none"></svg></div></section></main><script>const $=x=>document.getElementById(x),name=new URLSearchParams(location.search).get('name')||'RN1',n=x=>Number(x||0).toLocaleString('ru-RU'),m=x=>'$'+Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json()).then(d=>{let x=d.trader_cards.find(z=>z.leader===name);if(!x)return;$('name').textContent=x.leader;$('last').textContent='Последний сигнал: '+x.last_seen+' UTC';$('fills').textContent=n(x.fills);$('builds').textContent=n(x.builds);$('avg').textContent=m(x.avg_build);$('trades').textContent=n(x.trades);$('settled').textContent=n(x.settled);$('pnl').textContent=m(x.pnl);$('roi').textContent=x.roi+'%';let a=d.equity.filter(z=>z.leader===name),run=0;a=a.map(z=>({...z,pnl:(run+=Number(z.trade_pnl))}));if(a.length){let v=a.map(z=>z.pnl),mn=Math.min(0,...v),mx=Math.max(0,...v),rg=mx-mn||1,pts=a.map((z,i)=>`${12+i/(a.length-1||1)*976},${205-(z.pnl-mn)/rg*190}`).join(' ');$('chart').innerHTML=`<polyline points="${pts}" fill="none" stroke="#77a7ff" stroke-width="3" vector-effect="non-scaling-stroke"/>`}else $('chart').outerHTML='<div class="m" style="padding:30px 0">По новому правилу пока нет закрытых сделок.</div>'})</script></body></html>
