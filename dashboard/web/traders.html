<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трейдеры — CopyEdge</title><link rel="icon" href="/app/favicon.svg"><style>:root{color-scheme:dark;--bg:#070a0f;--p:#101823;--line:#223043;--t:#eef4fa;--m:#8998ab;--b:#77a7ff;--g:#42d986;--r:#ff6d78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.w{width:min(1240px,calc(100% - 28px));margin:auto;padding:22px 0 70px}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center}.back{color:var(--b);font-weight:700}.brand{font-size:19px;font-weight:850}.brand b{color:var(--b)}h1{font-size:38px;margin:38px 0 6px}.m{color:var(--m)}.panel{margin-top:24px;background:linear-gradient(180deg,#111a25,#0e151e);border:1px solid var(--line);border-radius:18px;padding:12px 18px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px}th,td{text-align:left;padding:16px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.rank{font-size:20px;font-weight:850;color:#64758a}.name{font-size:17px;font-weight:850}.dot{display:inline-block;width:8px;height:8px;background:var(--g);border-radius:50%;margin-right:9px}.good{color:var(--g)}.bad{color:var(--r)}.open{color:var(--b);font-weight:750}tr:last-child td{border-bottom:0}tbody tr:hover{background:#14202d}@media(max-width:650px){h1{font-size:31px}.w{width:min(100% - 18px,1240px)}.panel{padding:7px 10px}}</style></head><body><main class="w"><div class="top"><a class="back" href="/app/">← Dashboard</a><div class="brand">Copy<b>Edge</b></div></div><h1>Отслеживаемые трейдеры</h1><div class="m">Сравнение по одной базовой модели: каждый BUY-fill отдельно, размер CopyEdge = 1% размера fill трейдера.</div><section class="panel"><div class="scroll"><table><thead><tr><th>#</th><th>Трейдер</th><th>BUY fills</th><th>Рассчитано</th><th>Объём</th><th>Copy 1%</th><th>PnL</th><th>ROI</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const n=x=>Number(x||0).toLocaleString('ru-RU'),m=x=>'$'+Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),p=x=>Number(x||0).toFixed(2)+'%',cl=x=>Number(x)>=0?'good':'bad';fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('rows').innerHTML=d.fill_copy.leaders.map((x,i)=>`<tr><td class="rank">${i+1}</td><td class="name"><span class="dot"></span>${x.leader}</td><td>${n(x.fills)}</td><td>${n(x.settled_fills)}</td><td>${m(x.leader_volume)}</td><td>${m(x.copied)}</td><td class="${cl(x.pnl)}">${m(x.pnl)}</td><td class="${cl(x.roi)}"><b>${p(x.roi)}</b></td><td><a class="open" href="/app/?trader=${encodeURIComponent(x.leader)}">Dashboard →</a></td></tr>`).join('')})</script></body></html>
