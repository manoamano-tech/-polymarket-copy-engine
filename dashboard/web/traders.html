<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трейдеры — CopyEdge</title><style>:root{color-scheme:dark;--bg:#070a0f;--p:#101823;--line:#223043;--t:#eef4fa;--m:#8998ab;--b:#77a7ff;--g:#42d986}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.w{width:min(1100px,calc(100% - 24px));margin:auto;padding:20px 0 60px}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center}.back{color:var(--b)}h1{font-size:36px;margin:38px 0 5px}.m{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}.card{background:linear-gradient(180deg,#121b27,#0e151e);border:1px solid var(--line);border-radius:17px;padding:20px}.name{font-size:24px;font-weight:800}.live{display:inline-block;width:8px;height:8px;background:var(--g);border-radius:50%;margin-right:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.v{font-size:19px;font-weight:800;margin-top:4px}.good{color:var(--g)}.cta{margin-top:18px;color:var(--b);font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:31px}}</style></head><body><main class="w"><div class="top"><a class="back" href="/app/">← Панель</a><b>Copy<span style="color:var(--b)">Edge</span></b></div><h1>Трейдеры</h1><div class="m">Кошельки, которые сейчас отслеживает CopyEdge</div><section class="grid" id="grid"></section></main><script>const n=x=>Number(x||0).toLocaleString('ru-RU'),m=x=>'$'+Number(x||0).toLocaleString('en-US',{maximumFractionDigits:0});fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('grid').innerHTML=d.trader_cards.map(x=>`<a class="card" href="/app/trader.html?name=${encodeURIComponent(x.leader)}"><div class="name"><span class="live"></span>${x.leader}</div><div class="m">Последний сигнал: ${x.last_seen||'—'} UTC</div><div class="stats"><div><div class="m">Сигналов</div><div class="v">${n(x.fills)}</div></div><div><div class="m">Позиций</div><div class="v">${n(x.builds)}</div></div><div><div class="m">Средняя позиция</div><div class="v">${m(x.avg_build)}</div></div><div><div class="m">Новая стратегия</div><div class="v">${n(x.trades)} сделок</div></div><div><div class="m">Закрыто</div><div class="v">${n(x.settled)}</div></div><div><div class="m">Результат</div><div class="v ${x.pnl>0?'good':''}">${m(x.pnl)}</div></div></div><div class="cta">Открыть аналитику →</div></a>`).join('')})</script></body></html>
