<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трейдеры — CopyEdge</title><link rel="icon" href="/favicon.svg"><style>
:root{color-scheme:dark;--bg:#070a0f;--p:#101823;--p2:#0b121b;--line:#223043;--t:#eef4fa;--m:#8998ab;--b:#77a7ff;--g:#42d986;--r:#ff6e78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{width:min(1120px,calc(100% - 28px));margin:auto;padding:22px 0 70px}a{color:inherit;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:850}.brand svg{width:29px;height:29px}.back{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid #28405a;border-radius:11px;background:#0d1621;color:var(--b);font-weight:750}.hero{margin:38px 0 22px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #28405a;border-radius:999px;color:#aab8ca;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px #42d98655}h1{font-size:42px;line-height:1.05;margin:14px 0 8px}.m{color:var(--m)}.panel{background:linear-gradient(180deg,#121b27,#0e151e);border:1px solid var(--line);border-radius:18px;padding:12px 20px;margin-top:15px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:17px 11px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.07em}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#14202d}.rank{font-size:18px;font-weight:850;color:#66778c}.name{font-size:17px;font-weight:850}.status{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:9px}.good{color:var(--g)}.bad{color:var(--r)}.open{display:inline-flex;padding:8px 11px;border:1px solid #28405a;border-radius:9px;color:var(--b);font-weight:750;background:#0d1621}.footer{margin-top:24px;padding-top:18px;border-top:1px solid #172333;color:#6f8094;font-size:12px;display:flex;justify-content:space-between;gap:12px}
@media(max-width:720px){.w{width:min(100% - 22px,1120px);padding-top:16px}.brand{font-size:18px}.hero{margin-top:30px}h1{font-size:34px}.panel{padding:8px 12px;border-radius:16px}.footer{display:block}.footer div+div{margin-top:6px}}
</style></head><body><main class="w"><div class="top"><a class="brand" href="/"><svg viewBox="0 0 32 32" fill="none"><path d="M4 24L10 18L15 20L22 11L28 7" stroke="#77a7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 7H28V12" stroke="#42d986" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Copy<span style="color:#77a7ff">Edge</span></span></a><a class="back" href="/app/">← Dashboard</a></div>
<div class="hero"><div class="eyebrow"><span class="dot"></span> Мониторинг лидеров</div><h1>Трейдеры</h1><div class="m">Все лидеры, которых отслеживает CopyEdge. Метрики рассчитаны по одной базовой модели копирования.</div></div>
<section class="panel"><div class="scroll"><table><thead><tr><th>#</th><th>Трейдер</th><th>BUY fills</th><th>Закрыто</th><th>Объём</th><th>Copy 1%</th><th>PnL</th><th>ROI</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="footer"><div>CopyEdge · исследование копитрейдинга Polymarket</div><div><a href="/app/">Dashboard</a> · <a href="/app/trades.html">Сделки</a> · <a href="/app/rules.html">Конструктор</a></div></div></main>
<script>const n=x=>Number(x||0).toLocaleString('ru-RU'),m=x=>'$'+Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),p=x=>Number(x||0).toFixed(2)+'%',cl=x=>Number(x)>=0?'good':'bad';fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('rows').innerHTML=d.fill_copy.leaders.map((x,i)=>`<tr><td class="rank">${i+1}</td><td class="name"><span class="status"></span>${x.leader}</td><td>${n(x.fills)}</td><td>${n(x.settled_fills)}</td><td>${m(x.leader_volume)}</td><td>${m(x.copied)}</td><td class="${cl(x.pnl)}">${m(x.pnl)}</td><td class="${cl(x.roi)}"><b>${p(x.roi)}</b></td><td><a class="open" href="/app/?trader=${encodeURIComponent(x.leader)}">Открыть →</a></td></tr>`).join('')})</script></body></html>
