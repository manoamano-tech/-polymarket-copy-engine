<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CopyEdge Dashboard</title>
<style>:root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--line:#202a36;--muted:#8290a3;--text:#edf3f8;--good:#45d483;--bad:#ff6b72;--accent:#78a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:25px;font-weight:800}.brand span{color:var(--accent)}.live{color:var(--good)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:750;margin-top:7px}.good{color:var(--good)}.bad{color:var(--bad)}.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.panel h2{font-size:15px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:11px}td.event{max-width:260px;overflow:hidden;text-overflow:ellipsis}.scroll{overflow:auto;max-height:520px}.tag{padding:3px 7px;border-radius:999px;background:#18202b;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.wrap{padding:15px}}</style></head>
<body><div class="wrap"><header><div><div class="brand">Copy<span>Edge</span></div><div class="label">Prediction-market analytics</div></div><div class="live">● LIVE · <span id="clock">connecting</span></div></header><div class="grid"><div class="card"><div class="label">Raw fills</div><div class="value" id="fills">—</div></div><div class="card"><div class="label">Builds</div><div class="value" id="builds">—</div></div><div class="card"><div class="label">Paper trades</div><div class="value" id="trades">—</div></div><div class="card"><div class="label">Settled</div><div class="value" id="settled">—</div></div><div class="card"><div class="label">F2–9 forward ROI</div><div class="value" id="froi">—</div><div class="label" id="fmeta"></div></div></div>
<div class="cols"><section class="panel"><h2>Strategy matrix</h2><div class="scroll"><table><thead><tr><th>Strategy</th><th>Trades</th><th>Settled</th><th>PnL</th><th>ROI</th></tr></thead><tbody id="strategies"></tbody></table></div></section><section class="panel"><h2>Leaders</h2><table><thead><tr><th>Leader</th><th>Fills</th><th>Volume</th><th>Last seen UTC</th></tr></thead><tbody id="leaders"></tbody></table></section></div>
<section class="panel" style="margin-top:14px"><h2>Latest paper trades</h2><div class="scroll"><table><thead><tr><th>Opened UTC</th><th>Strategy</th><th>Leader</th><th>Event</th><th>Outcome</th><th>Entry</th><th>Status</th><th>PnL</th></tr></thead><tbody id="latest"></tbody></table></div></section></div><script>
const $=id=>document.getElementById(id), n=x=>Number(x||0).toLocaleString('en-US'), money=x=>'$'+Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), cls=x=>Number(x)>=0?'good':'bad';
async function refresh(){try{const d=await fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json());$('clock').textContent=new Date(d.ts*1000).toLocaleTimeString();for(const k of ['fills','builds','trades','settled'])$(k).textContent=n(d.counts[k]);$('froi').textContent=Number(d.forward.roi||0).toFixed(2)+'%';$('froi').className='value '+cls(d.forward.roi);$('fmeta').textContent=`${d.forward.settled}/${d.forward.trades} settled · ${money(d.forward.pnl)} PnL`;
$('strategies').innerHTML=d.strategies.map(s=>`<tr><td>${s.strategy}</td><td>${n(s.trades)}</td><td>${n(s.settled)}</td><td class="${cls(s.pnl)}">${money(s.pnl)}</td><td class="${cls(s.roi)}">${Number(s.roi).toFixed(2)}%</td></tr>`).join('');
$('leaders').innerHTML=d.leaders.map(x=>`<tr><td>${x.leader}</td><td>${n(x.fills)}</td><td>${money(x.volume)}</td><td>${x.last_seen||'—'}</td></tr>`).join('');
$('latest').innerHTML=d.latest.map(x=>`<tr><td>${x.opened}</td><td>${x.strategy}</td><td>${x.leader}</td><td class="event" title="${x.event}">${x.event}</td><td>${x.outcome}</td><td>${x.entry}</td><td><span class="tag">${x.status}</span></td><td class="${x.pnl==null?'':cls(x.pnl)}">${x.pnl==null?'—':money(x.pnl)}</td></tr>`).join('');}catch(e){$('clock').textContent='reconnecting…'}}refresh();setInterval(refresh,5000);
</script></body></html>
