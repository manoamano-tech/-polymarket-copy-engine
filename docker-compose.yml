services:
  trader:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8765:8765"
